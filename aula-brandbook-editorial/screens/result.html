<!doctype html><html lang="es" data-theme="light" data-vertical="museos"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../ui/aula-ui.css"><style>body{width:390px;min-height:844px;position:relative;overflow:hidden}</style></head><body><div style="padding:18px 20px 0"><img src="../logo/aula-museos-horizontal.svg" height="30" alt="Aula. Museos"></div><main style="padding:18px 20px">
<p class="vtag" style="margin:0 0 8px"><span class="marker"></span>Simulacro completo · Museos</p>
<div style="display:flex;align-items:baseline;gap:10px"><span class="serif" style="font-size:72px;line-height:1">21,64</span><span class="muted">sobre 30</span></div>
<div style="position:relative;height:6px;background:var(--line);border-radius:6px;margin:20px 0 8px"><i style="position:absolute;left:0;top:0;bottom:0;width:72.1%;background:var(--ink);border-radius:6px"></i><span style="position:absolute;left:50%;top:-6px;width:2px;height:18px;background:var(--gold)"></span></div>
<div style="display:flex;justify-content:space-between;font:500 12px var(--font-sans);color:var(--subtle);margin-bottom:18px"><span>0</span><span>15 · nota de corte orientativa</span><span>30</span></div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">
<div class="card" style="padding:12px"><b class="mono" style="font-size:22px;font-weight:500;color:var(--success)">68</b><br><small class="subtle">aciertos</small></div><div class="card" style="padding:12px"><b class="mono" style="font-size:22px;font-weight:500;color:var(--error)">21</b><br><small class="subtle">errores</small></div><div class="card" style="padding:12px"><b class="mono" style="font-size:22px;font-weight:500;color:var(--muted)">11</b><br><small class="subtle">en blanco</small></div></div>
<div class="card" style="margin-bottom:14px"><h3 style="font-size:15px">Cómo se calcula</h3>
<p class="code" style="font-size:12px;margin:0;line-height:1.75">D = 68 − 21 ÷ 3 = 61,00<br>C = 30 (corte)<br>D ≥ C → 15 + (61 − 30) ÷ (100 − 30) × 15<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= <b>21,64</b></p></div>
<div class="toast ok" style="margin-bottom:14px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" class="ic" style="color:currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg> Por encima del corte orientativo. Repasa tus 21 errores.</div>
<a class="btn btn-primary big full">Repasar errores</a></main></body></html>
