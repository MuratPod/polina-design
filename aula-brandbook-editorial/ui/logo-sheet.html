<!doctype html><html lang="es" data-theme="light" data-vertical="museos"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../ui/aula-ui.css"><style>body{width:1280px;min-height:800px;position:relative;overflow:hidden}</style></head><body><div style="padding:36px 48px"><p class="eyebrow">Logotipo · «Aula.» — el punto significa «resuelto»</p>
<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:14px;margin:14px 0"><figure style="margin:0;padding:18px;border-radius:12px;background:#fff;border:1px solid var(--line)"><img src="../logo/aula-umbrella-horizontal.svg" style="height:64px;max-width:100%"><figcaption class="mono" style="font-size:10px;color:#66697F;margin-top:6px">aula-umbrella-horizontal</figcaption></figure><figure style="margin:0;padding:18px;border-radius:12px;background:#fff;border:1px solid var(--line)"><img src="../logo/aula-stacked-light.svg" style="height:110px;max-width:100%"><figcaption class="mono" style="font-size:10px;color:#66697F;margin-top:6px">aula-stacked-light</figcaption></figure><figure style="margin:0;padding:18px;border-radius:12px;background:#fff;border:1px solid var(--line)"><img src="../logo/aula-mark-light.svg" style="height:80px;max-width:100%"><figcaption class="mono" style="font-size:10px;color:#66697F;margin-top:6px">aula-mark-light</figcaption></figure><figure style="margin:0;padding:18px;border-radius:12px;background:#14213D;border:1px solid var(--line)"><img src="../logo/aula-stacked-dark.svg" style="height:110px;max-width:100%"><figcaption class="mono" style="font-size:10px;color:#B9BCC8;margin-top:6px">aula-stacked-dark</figcaption></figure></div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px"><figure style="margin:0;padding:18px;border-radius:12px;background:#fff;border:1px solid var(--line)"><img src="../logo/aula-museos-horizontal.svg" style="height:40px;max-width:100%"><figcaption class="mono" style="font-size:10px;color:#66697F;margin-top:6px">aula-museos-horizontal</figcaption></figure><figure style="margin:0;padding:18px;border-radius:12px;background:#fff;border:1px solid var(--line)"><img src="../logo/aula-justicia-horizontal.svg" style="height:40px;max-width:100%"><figcaption class="mono" style="font-size:10px;color:#66697F;margin-top:6px">aula-justicia-horizontal</figcaption></figure><figure style="margin:0;padding:18px;border-radius:12px;background:#fff;border:1px solid var(--line)"><img src="../logo/aula-policia-horizontal.svg" style="height:40px;max-width:100%"><figcaption class="mono" style="font-size:10px;color:#66697F;margin-top:6px">aula-policia-horizontal</figcaption></figure><figure style="margin:0;padding:18px;border-radius:12px;background:#fff;border:1px solid var(--line)"><img src="../logo/aula-educacion-horizontal.svg" style="height:40px;max-width:100%"><figcaption class="mono" style="font-size:10px;color:#66697F;margin-top:6px">aula-educacion-horizontal</figcaption></figure><figure style="margin:0;padding:18px;border-radius:12px;background:#14213D;border:1px solid var(--line)"><img src="../logo/aula-museos-on-dark.svg" style="height:40px;max-width:100%"><figcaption class="mono" style="font-size:10px;color:#B9BCC8;margin-top:6px">aula-museos-on-dark</figcaption></figure><figure style="margin:0;padding:18px;border-radius:12px;background:#14213D;border:1px solid var(--line)"><img src="../logo/aula-justicia-on-dark.svg" style="height:40px;max-width:100%"><figcaption class="mono" style="font-size:10px;color:#B9BCC8;margin-top:6px">aula-justicia-on-dark</figcaption></figure><figure style="margin:0;padding:18px;border-radius:12px;background:#14213D;border:1px solid var(--line)"><img src="../logo/aula-policia-on-dark.svg" style="height:40px;max-width:100%"><figcaption class="mono" style="font-size:10px;color:#B9BCC8;margin-top:6px">aula-policia-on-dark</figcaption></figure><figure style="margin:0;padding:18px;border-radius:12px;background:#14213D;border:1px solid var(--line)"><img src="../logo/aula-educacion-on-dark.svg" style="height:40px;max-width:100%"><figcaption class="mono" style="font-size:10px;color:#B9BCC8;margin-top:6px">aula-educacion-on-dark</figcaption></figure></div>
<div style="display:grid;grid-template-columns:1.3fr 2fr;gap:14px;margin-top:14px"><figure style="margin:0;padding:18px;border-radius:12px;background:#fff;border:1px solid var(--line)"><img src="../logo/aula-clearspace.svg" style="height:150px;max-width:100%"><figcaption class="mono" style="font-size:10px;color:#66697F;margin-top:6px">aula-clearspace</figcaption></figure><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><figure style="margin:0" class="card"><img src="../logo/aula-umbrella-horizontal.svg" style="height:40px;transform:scaleX(1.4);transform-origin:left"><figcaption class="subtle" style="font-size:12px;margin-top:8px">✕ No deformar</figcaption></figure><figure style="margin:0" class="card"><img src="../logo/aula-umbrella-horizontal.svg" style="height:40px;filter:hue-rotate(160deg) saturate(3)"><figcaption class="subtle" style="font-size:12px;margin-top:8px">✕ No cambiar colores</figcaption></figure><figure style="margin:0" class="card"><img src="../logo/aula-umbrella-horizontal.svg" style="height:40px;transform:rotate(-10deg)"><figcaption class="subtle" style="font-size:12px;margin-top:8px">✕ No girar</figcaption></figure><figure style="margin:0" class="card"><img src="../logo/aula-umbrella-horizontal.svg" style="height:40px;background:repeating-linear-gradient(45deg,#D9A21B 0 6px,#fff 6px 12px)"><figcaption class="subtle" style="font-size:12px;margin-top:8px">✕ No sobre fondos ruidosos</figcaption></figure><figure style="margin:0" class="card"><img src="../logo/aula-umbrella-horizontal.svg" style="height:40px;opacity:.35"><figcaption class="subtle" style="font-size:12px;margin-top:8px">✕ No bajar opacidad</figcaption></figure><figure style="margin:0" class="card"><img src="../logo/aula-umbrella-horizontal.svg" style="height:40px;filter:drop-shadow(3px 3px 0 #000)"><figcaption class="subtle" style="font-size:12px;margin-top:8px">✕ No añadir sombras</figcaption></figure></div></div></div></body></html>
