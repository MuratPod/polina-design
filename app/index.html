<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aula Museos · Ayudantes de Museos del Estado</title>
<meta name="description" content="Aula Museos — prepara la oposición a Ayudantes de Museos del Estado: modo prueba con explicación y fuente, y simulacro con +1 / 0 / −1/3.">
<meta name="theme-color" content="#15393F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160'%3E%3Crect width='160' height='160' rx='36' fill='%2315393F'/%3E%3Cpath d='M30 128V74a50 50 0 0 1 100 0v54' fill='none' stroke='%23C49A45' stroke-width='6' stroke-linecap='round'/%3E%3Ctext x='80' y='116' text-anchor='middle' font-family='Georgia,serif' font-weight='600' font-size='52' fill='%23F6F1E8'%3EAM%3C/text%3E%3Cpath d='M26 134h108' stroke='%23C49A45' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink-900:#0F2A30;--ink-800:#15393F;--ink-700:#1D4D55;--ink-600:#28646D;--ink-100:#DCE9E8;--ink-50:#EEF5F4;
  --terra-600:#A84B2A;--terra-500:#C0643F;--terra-100:#F6E3D9;--gold-500:#C49A45;--gold-100:#F5EBD3;
  --paper:#F6F1E8;--paper-2:#EFE8DB;--surface:#FFFDF8;--line:#E3D9C8;--text:#1B2427;--muted:#56615F;--subtle:#6E7775;
  --ok-700:#2D6B4C;--ok-100:#DFEEE4;--err-700:#9A3B28;--err-100:#F6E0D8;--ai-700:#4B3F8F;--ai-100:#E9E6F7;
  --serif:"Source Serif 4","Iowan Old Style",Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-sm:10px;--r-md:16px;--r-lg:22px;--r-pill:999px;--sh-1:0 1px 2px rgba(15,42,48,.06),0 2px 8px rgba(15,42,48,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--text);background:var(--paper);line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--ink-700)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold-500);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;padding:0 18px 40px;min-height:100vh;display:flex;flex-direction:column}
header.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink-800)}
.logo svg{width:30px;height:32px}
.logo b{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:-.2px}
.ver{font-size:11px;color:var(--subtle);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-800);flex:none;font-size:18px}
h1,h2,.serif{font-family:var(--serif);color:var(--ink-900);font-weight:600;line-height:1.15}
h1{font-size:30px}h2{font-size:23px}
.lead{color:var(--muted);margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-1)}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:11.5px}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:var(--r-md);font-weight:600;font-size:15.5px;transition:background .2s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--ink-800);color:#fff;box-shadow:0 3px 0 var(--ink-900)}
.btn-primary:hover{background:var(--ink-700)}
.btn-primary[disabled]{background:#B7C3C2;box-shadow:none;cursor:not-allowed}
.btn-ghost{border:1.5px solid var(--line);color:var(--ink-800);background:var(--surface)}
.btn-gold{background:var(--gold-500);color:var(--ink-900);box-shadow:0 3px 0 #8A6A2C}
.btn-text{color:var(--muted);font-size:14px;padding:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:500;background:var(--surface);border:1px solid var(--line);color:var(--ink-800);white-space:nowrap}
.chip.ai{background:var(--ai-100);color:var(--ai-700);border-color:#D3CCF0;font-weight:600}
.chip.demo{border-style:dashed;color:var(--subtle)}
.chip.lvl{background:var(--ink-50);border-color:var(--ink-100);font-weight:700;font-size:11px}
.chip.ok{background:var(--ok-100);color:var(--ok-700);border-color:#BFDCC9;font-weight:700}
.chip.err{background:var(--err-100);color:var(--err-700);border-color:#EBC3B6;font-weight:700}
.chip.blank{background:transparent;color:var(--muted);border:1.5px dashed #A9A291;font-weight:700}
.chip.streak{background:var(--terra-100);color:var(--terra-600);border-color:#EBC8B6}
/* temas */
.temas{display:grid;gap:10px}
.tema{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line)}
.tema:hover{border-color:var(--ink-600)}
.tema.sel{border-color:var(--ink-700);background:var(--ink-50);box-shadow:0 2px 0 var(--ink-600)}
.tema .num{width:36px;height:36px;border-radius:10px;background:var(--ink-100);color:var(--ink-800);display:grid;place-items:center;font-family:var(--serif);font-weight:700;flex:none}
.tema.sel .num{background:var(--ink-800);color:#fff}
.tema b{display:block;font-size:15px;color:var(--ink-900)}
.tema small{color:var(--muted);font-size:12.5px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:left;padding:14px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted)}
.mode b{display:block;font-family:var(--serif);font-size:17px;color:var(--ink-900);margin-bottom:4px}
.mode.sel{border-color:var(--ink-700);background:var(--ink-50)}
.mode.ex.sel{background:var(--ink-800);border-color:var(--ink-800);color:#CFE0DE}.mode.ex.sel b{color:#fff}
.formula{font-family:var(--serif);font-size:15px;color:var(--ink-900);background:var(--paper-2);border-radius:var(--r-sm);padding:8px 10px;text-align:center}
/* question */
.top{display:flex;align-items:center;gap:12px;padding:12px 0 6px}
.progress{flex:1;height:10px;border-radius:var(--r-pill);background:var(--ink-100);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--ink-600),var(--ink-800));transition:width .4s}
.q{font-family:var(--serif);font-size:21px;line-height:1.3;color:var(--ink-900);font-weight:600;margin:12px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line);font-size:15px}
.opt .k{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);flex:none}
button.opt:not([disabled]):hover{border-color:var(--ink-600)}
.opt.sel{border-color:var(--ink-700);background:var(--ink-50)}
.opt.sel .k{background:var(--ink-700);border-color:var(--ink-700);color:#fff}
.opt.right{border-color:var(--ok-700);background:var(--ok-100)}.opt.right .k{background:var(--ok-700);border-color:var(--ok-700);color:#fff}
.opt.wrong{border-color:var(--err-700);background:var(--err-100)}.opt.wrong .k{background:var(--err-700);border-color:var(--err-700);color:#fff}
.opt .tag{margin-left:auto;font-size:11.5px;font-weight:600}
.foot{margin-top:18px;display:grid;gap:8px}
/* exam (dark) */
body.dark{background:var(--ink-900);color:#EFF5F4}
body.dark .logo{color:#F6F1E8}body.dark .ver{color:#9FBDBA}
body.dark .q{color:#fff}
body.dark .opt{background:#183A40;border-color:#2C5960;box-shadow:none;color:#EFF5F4}
body.dark .opt .k{border-color:#3C6C73;color:#B9D3D1}
body.dark .opt.sel{background:#22525A;border-color:var(--gold-500)}
body.dark .opt.sel .k{background:var(--gold-500);border-color:var(--gold-500);color:var(--ink-900)}
body.dark .iconbtn{background:transparent;border-color:#2C5960;color:#fff}
body.dark .progress{background:#21474D}body.dark .progress i{background:var(--gold-500)}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.tally div{border-radius:12px;padding:8px 10px;background:#183A40;border:1px solid #2C5960;font-size:11.5px;color:#B9D3D1}
.tally b{display:block;font-size:18px;color:#fff;font-variant-numeric:tabular-nums}
.tally .bl{border-style:dashed;border-color:#6D9BA0}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:#9FBDBA}
.legend span{padding:3px 8px;border-radius:var(--r-pill);border:1px solid #2C5960}
.btn-blank{background:transparent;color:#fff;border:1.5px dashed #6D9BA0}
.btn-blank.on{background:#2C5960;border-style:solid}
.qgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:8px}
.qgrid button{height:26px;border-radius:6px;background:#21474D;font-size:10px;color:#9FBDBA}
.qgrid button.a{background:#3E7C83;color:#fff}
.qgrid button.b{background:transparent;border:1.5px dashed #6D9BA0;color:#CFE0DE}
.qgrid button.c{outline:2px solid var(--gold-500)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
/* feedback */
.sheet{border-radius:var(--r-lg);padding:18px 16px;margin-top:16px}
.sheet.ok{background:var(--ok-100);border-top:3px solid var(--ok-700)}
.sheet.err{background:#FBEFE6;border-top:3px solid var(--terra-500)}
.sheet.bl{background:var(--paper-2);border-top:3px dashed #A9A291}
.sheet h3{font-family:var(--serif);font-size:21px;font-weight:600}
.sheet.ok h3{color:var(--ok-700)}.sheet.err h3{color:var(--terra-600)}.sheet.bl h3{color:var(--ink-800)}
.explain{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;font-size:14.5px;margin-top:12px}
.explain p+p{margin-top:8px}
.aibox{background:var(--surface);border:1px solid #D3CCF0;border-left:4px solid var(--ai-700);border-radius:var(--r-md);padding:14px;margin-top:12px;font-size:14.5px}
.aibox .ai-note{font-size:11.5px;color:var(--ai-700);margin-top:8px}
.aibox.loading .ai-text{color:var(--subtle);font-style:italic}
.cite{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-sm);background:var(--paper);border:1px solid var(--line);margin-top:8px;text-decoration:none;color:var(--ink-800);font-size:13px}
.cite b{display:block;font-size:13px}.cite small{color:var(--muted)}
.cite .lvln{width:24px;height:24px;border-radius:50%;background:var(--ink-800);color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center;flex:none}
details.hier{margin-top:10px;font-size:12.5px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:10px 12px}
details.hier summary{cursor:pointer;font-weight:600;color:var(--ink-800)}
details.hier ol{margin:8px 0 0 18px;color:var(--muted)}
details.hier li.on{color:var(--ink-900);font-weight:600}
/* results */
.score{display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-family:var(--serif);font-size:26px;color:var(--ink-900)}.ring small{font-size:10.5px;color:var(--muted)}
.res3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.res3 div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.res3 b{font-family:var(--serif);font-size:24px;display:block}
.res3 span{font-size:12px;color:var(--muted)}
.res3 .bl{border:1.5px dashed #A9A291;background:transparent}
.split{display:flex;height:12px;border-radius:var(--r-pill);overflow:hidden;background:var(--paper-2)}
.split i{display:block;height:100%}
.rev{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);font-size:13.5px}
.rev .t{flex:1}.rev small{display:block;color:var(--muted);font-size:12px}
.disc{background:#F7EBCF;border:1px solid #EAD4A2;color:#5E3F0C;border-radius:var(--r-md);padding:10px 12px;font-size:12.5px}
.onb-hero{background:var(--ink-800);color:#F3EFE6;border-radius:var(--r-lg);padding:22px;margin-top:6px}
.onb-hero h1{color:#fff;font-size:28px}
.onb-hero p{color:#CFE0DE;margin-top:8px;font-size:14.5px}
.points{display:grid;gap:10px;margin-top:14px}
.points div{display:flex;gap:10px;font-size:14px}
.points i{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--gold-100);color:#6E531B;display:grid;place-items:center;font-weight:700;flex:none;font-size:12px}
footer{margin-top:auto;padding-top:28px;font-size:11.5px;color:var(--subtle);text-align:center}
body.dark footer{color:#6D9BA0}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="app">
  <header class="bar">
    <a class="logo" href="#" data-act="home" aria-label="Aula Museos · inicio">

      <b>Aula Museos</b>
    </a>
    <span class="ver">Web v0.1</span>
  </header>
  <main id="view" aria-live="polite"></main>
  <footer>Aula Museos · preparación de la oposición a Ayudantes de Museos del Estado. Herramienta de estudio no oficial; preguntas de ejemplo. Contrasta siempre con el BOE.</footer>
</div>

<script>
/* =====================================================================
   Aula Museos · Web v0.1
   Flujo: inicio/onboarding → tema → modo (prueba | examen) → preguntas →
   explicación (prueba) / resultado con −1/3 (examen) → revisión.
   Estado en memoria + localStorage (solo onboarding visto y último resultado).
   ===================================================================== */

/* ---------- Jerarquía de fuentes (8 niveles, v0.2) ---------- */
const SOURCE_LEVELS = [
  "Temario BOE","Legislación","BNE · opositores museos","Normalización documental",
  "Planes nacionales","Guías del Ministerio","Webs de museos","Investigaciones"
];
const BOE = id => "https://www.boe.es/buscar/act.php?id=" + id;

/* ---------- Banco de preguntas de ejemplo ----------
   ok = índice de la respuesta correcta. src = fuente oficial (nivel 1-8).
   explain = explicación didáctica redactada (no IA). */
const TEMAS = [
 { id:"lphe", n:"1", t:"Patrimonio Histórico Español", d:"Ley 16/1985 · categorías, exportación, arqueología", qs:[
  { q:"Según la Ley 16/1985, ¿qué categoría otorga la máxima protección a bienes muebles e inmuebles?",
    o:["Bien inventariado","Bien de Interés Cultural (BIC)","Bien catalogado de relevancia regional","Monumento histórico-artístico nacional"], ok:1,
    explain:"La Ley distingue tres niveles: los <b>Bienes de Interés Cultural</b> (máxima protección, muebles e inmuebles), los bienes muebles incluidos en el <b>Inventario General</b> y el resto del Patrimonio Histórico Español. «Monumento histórico-artístico» es terminología anterior a 1985.",
    src:{title:"Ley 16/1985, del Patrimonio Histórico Español · art. 9", id:"BOE-A-1985-12534", level:2} },
  { q:"Los bienes muebles de notable valor que no hayan sido declarados BIC deben incluirse en:",
    o:["El Registro General de Bienes de Interés Cultural","El Inventario General de Bienes Muebles","El Catálogo Colectivo del Patrimonio Bibliográfico","El Censo de Bienes Integrantes del Patrimonio Documental"], ok:1,
    explain:"El <b>Inventario General</b> recoge los bienes muebles de singular relevancia no declarados de interés cultural. El Registro General es solo para BIC; el Catálogo Colectivo y el Censo corresponden a patrimonio bibliográfico y documental.",
    src:{title:"Ley 16/1985 · art. 26", id:"BOE-A-1985-12534", level:2} },
  { q:"¿A partir de qué antigüedad necesita un bien mueble del Patrimonio Histórico Español autorización expresa y previa para su exportación?",
    o:["50 años","75 años","100 años","Solo si está declarado BIC"], ok:2,
    explain:"Necesitan autorización expresa y previa los bienes de <b>más de cien años</b> y, en todo caso, los inscritos en el Inventario General. Los BIC, además, son inexportables con carácter general.",
    src:{title:"Ley 16/1985 · art. 5", id:"BOE-A-1985-12534", level:2} },
  { q:"Los objetos arqueológicos descubiertos como consecuencia de excavaciones o hallazgos casuales son:",
    o:["Propiedad del descubridor","Propiedad del dueño del terreno","Bienes de dominio público","Propiedad compartida al 50 % entre descubridor y propietario"], ok:2,
    explain:"Son <b>bienes de dominio público</b>. El descubridor y el propietario del lugar tienen derecho a un <b>premio</b> en metálico (la mitad del valor de tasación, a partes iguales), pero no a la propiedad del objeto.",
    src:{title:"Ley 16/1985 · art. 44", id:"BOE-A-1985-12534", level:2} },
  { q:"¿Qué ley estatal contiene la definición legal de «Museo» como institución permanente que adquiere, conserva, investiga, comunica y exhibe colecciones?",
    o:["Ley 16/1985, art. 59.3","Ley 10/2015, art. 1","Ley 49/2002, art. 25","Constitución Española, art. 46"], ok:0,
    explain:"La definición está en el <b>art. 59.3 de la Ley 16/1985</b>. La Ley 10/2015 regula el patrimonio cultural inmaterial; la Ley 49/2002, el mecenazgo; el art. 46 CE es el mandato de conservación.",
    src:{title:"Ley 16/1985 · art. 59.3", id:"BOE-A-1985-12534", level:2} }
 ]},
 { id:"museos", n:"2", t:"Museos estatales", d:"RD 620/1987 · áreas básicas, gestión", qs:[
  { q:"¿Qué norma aprueba el Reglamento de Museos de Titularidad Estatal y del Sistema Español de Museos?",
    o:["Ley 16/1985, de 25 de junio","Real Decreto 620/1987, de 10 de abril","Real Decreto 111/1986, de 10 de enero","Ley 10/2015, de 26 de mayo"], ok:1,
    explain:"Es el <b>Real Decreto 620/1987</b>. El RD 111/1986 desarrolla parcialmente la Ley 16/1985 en otros aspectos; no regula los museos estatales.",
    src:{title:"Real Decreto 620/1987, de 10 de abril", id:"BOE-A-1987-11621", level:2} },
  { q:"Según el RD 620/1987, las áreas básicas de trabajo de los museos de titularidad estatal son:",
    o:["Conservación e investigación, Difusión y Administración","Colecciones, Educación y Seguridad","Documentación, Restauración y Exposiciones","Dirección, Patronato y Gerencia"], ok:0,
    explain:"El reglamento integra todas las funciones en tres áreas dependientes de la Dirección: <b>Conservación e investigación</b>, <b>Difusión</b> y <b>Administración</b>. La seguridad de los fondos forma parte del área de Administración.",
    src:{title:"RD 620/1987 · art. 17", id:"BOE-A-1987-11621", level:2} },
  { q:"¿Cuál de estos museos NO es de gestión directa del Ministerio de Cultura?",
    o:["Museo Arqueológico Nacional","Museo del Traje. CIPE","Museo Sorolla","Museo Nacional del Prado"], ok:3,
    explain:"El <b>Museo Nacional del Prado</b> es un organismo público con régimen propio (Ley 46/2003). El MAN, el Museo del Traje y el Museo Sorolla son museos estatales de gestión directa adscritos al Ministerio.",
    src:{title:"Ley 46/2003, reguladora del Museo Nacional del Prado", id:"BOE-A-2003-21615", level:2} }
 ]},
 { id:"ce", n:"3", t:"Constitución y Administración", d:"CE, LPACAP, TREBEP", qs:[
  { q:"¿Qué artículo de la Constitución obliga a los poderes públicos a garantizar la conservación del patrimonio histórico, cultural y artístico?",
    o:["Art. 44","Art. 46","Art. 148","Art. 149"], ok:1,
    explain:"El <b>art. 46 CE</b> es el mandato de conservación y enriquecimiento del patrimonio. El art. 44 se refiere al acceso a la cultura; los arts. 148 y 149, al reparto de competencias.",

       citations: [{ title: string, url?: string, boeId?: string, sourceLevel: 1..8 }],

const AI_ENDPOINT = null; // p. ej. "https://api.aulamuseos.es/rag/answer"
async function fetchAiAnswer(ctx){
  if (AI_ENDPOINT){
    const r = await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(ctx)});
    if(!r.ok) throw new Error("RAG "+r.status);
    return r.json();
  }
  const q = ctx.q;
  await new Promise(r=>setTimeout(r,450)); // simula latencia
  return {
    text: "[Marcador de posición] Aquí aparecerá una explicación ampliada generada a partir de las fuentes oficiales del temario: contexto de la norma, relación con otros artículos y una regla para recordarla. Respuesta correcta: «"+q.o[q.ok]+"».",
    citations: [{ title:q.src.title, boeId:q.src.id, url:BOE(q.src.id), sourceLevel:q.src.level }],
    placeholder: true
  };
}
function renderAi(el, data){
  el.classList.remove("loading");
  el.dataset.aiState = "ready";
  el.querySelector(".ai-text").textContent = data.text;

    '<a class="cite" href="'+(c.url||BOE(c.boeId))+'" target="_blank" rel="noopener" data-source-level="'+c.sourceLevel+'">'+

}

function score(){

}

  if(t.dataset.pick!==undefined){if(S.checked)return;S.picked=+t.dataset.pick;view.querySelectorAll("[data-pick]").forEach(b=>b.classList.toggle("sel",b===t));view.querySelector('[data-act="check"]').disabled=false;return;}
  if(t.dataset.epick!==undefined){S.answers[S.i]={pick:+t.dataset.epick,blank:false};return examQ();}
  if(t.dataset.jump!==undefined){S.i=+t.dataset.jump;return examQ();}
  if(t.dataset.review!==undefined){return review(+t.dataset.review);}
  e.preventDefault();
  switch(t.dataset.act){
    case "home": return home();
    case "onb": localStorage.setItem("am_onb","1"); return temas();
    case "temas": return temas();
    case "start": return start();
    case "check": return pruebaFb(S.picked);
    case "dunno": return pruebaFb(null);
    case "next": S.i++; S.picked=null; return pruebaQ();
    case "pruebaEnd": return pruebaEnd();
    case "toExam": S.mode="examen"; return start();
    case "blank": S.answers[S.i]={pick:null,blank:!S.answers[S.i].blank}; return examQ();
    case "enext": if(S.i<S.tema.qs.length-1){S.i++;return examQ();} t.dataset.act="submit"; /* falls through */
    case "submit": {const pend=S.answers.filter(x=>x.pick===null&&!x.blank).length; if(pend&&!confirm("Quedan "+pend+" preguntas sin responder. Contarán como en blanco (0). ¿Entregar?"))return; return result();}
    case "quitExam": if(confirm("¿Salir del simulacro? Se perderán las respuestas.")) return temas(); return;
    case "result": return result();
    case "practiceErr": {const T=S.tema; const qs=T.qs.filter((q,k)=>S.answers[k].pick!==q.ok); if(!qs.length){alert("Sin fallos ni blancos: nada que repasar.");return;} S.tema={id:"rep",n:"↺",t:"Repaso de "+T.t,d:"",qs}; S.mode="prueba"; return start();}
  }
});
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const i="abcd".indexOf(e.key.toLowerCase()); if(i<0) return;
  const b=view.querySelector('[data-pick="'+i+'"],[data-epick="'+i+'"]'); if(b) b.click();
});
home();
</script>
